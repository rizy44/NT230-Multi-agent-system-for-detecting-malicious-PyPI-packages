[project]
name = "lamps-replica"
version = "0.1.0"
description = "LAMPS-style multi-agent detector for malicious PyPI packages."
requires-python = ">=3.10"
dependencies = [
  "crewai",
  "openai",
  "python-dotenv",
  "requests",
  "tqdm",
  "pandas",
  "scikit-learn",
  "torch",
  "transformers",
  "accelerate",
  "mcp",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
